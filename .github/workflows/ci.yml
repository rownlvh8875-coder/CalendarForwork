name: CI

on:
  push:
    branches:
      - main
      - feat/calendar-ui-mvp
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
